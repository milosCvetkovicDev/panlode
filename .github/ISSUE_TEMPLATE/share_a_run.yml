name: Share a run
description: Tell us what a scouting run or an experiment found, including the ideas it killed.
title: "Run report: "
labels: [run-report]
body:
  - type: markdown
    attributes:
      value: |
        Run reports show what works and what does not, and they shape the next recipes and rules.
        Share only what you are happy to make public: no customer names, no personal data of private
        individuals, nothing under an NDA.
  - type: textarea
    id: focus
    attributes:
      label: What you scouted
      description: The focus of the run and the recipes you used (forums, review sites, job posts, your own).
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What it found
      description: How many signals, their evidence scores, the clusters, and any idea shaped or killed.
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What got in the way
      description: A rule that was too strict or too loose, a recipe that came back empty, a check that was wrong.
  - type: input
    id: link
    attributes:
      label: Public link (optional)
      description: A public repository or write-up of the run, if there is one.
